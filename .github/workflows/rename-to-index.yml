name: Rename homepage to index.html
on:
  push:
    paths:
      - '.github/workflows/rename-to-index.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename homepage file to index.html
        run: |
          if [ -f luo-li-ge-ren-zhu-ye.html ]; then
            git config user.name "Golorial"
            git config user.email "Golorial@users.noreply.github.com"
            git mv luo-li-ge-ren-zhu-ye.html index.html
            git commit -m "Rename homepage to index.html"
            git push
          fi
